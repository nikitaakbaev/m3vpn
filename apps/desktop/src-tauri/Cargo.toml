[package]
name = "m3vpn"
version = "0.2.0"
description = "Material 3 proxy client for Linux"
authors = ["m3vpn"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "m3vpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"
open = "5"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots", "charset", "socks", "json"] }
base64 = "0.23"
m3vpn-parser = { path = "../../../crates/parser" }
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
